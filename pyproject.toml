[project]
name = "astrbot-plugin-mc-manager"
version = "1.1.1"
requires-python = ">=3.12"
description = "Group-scoped Minecraft server management for AstrBot"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
